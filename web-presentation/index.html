<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Presentasi interaktif Dragonfly Algorithm dan Dung Beetle Optimization untuk penjadwalan task di cloud."
    />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Metaheuristic Cloud Task Scheduling — DA &amp; DBO</title>
    <script>
      try {
        if (localStorage.getItem('soka-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        /* localStorage can be unavailable in private browsing contexts. */
      }
    </script>
  </head>
  <body>
    <div class="reveal">
      <div class="slides"></div>
    </div>

    <header class="deck-ui" data-deck-ui>
      <a
        class="deck-ui__brand"
        href="#/0"
        data-goto="title"
        aria-label="Kembali ke slide judul"
      >
        <span class="deck-ui__mark" aria-hidden="true"></span>
        <span class="deck-ui__brand-text">SOKA / Metaheuristik</span>
      </a>

      <p class="deck-ui__section">
        <span class="deck-ui__section-dot" aria-hidden="true"></span>
        <span data-section-label>Pembuka</span>
      </p>

      <nav class="deck-ui__actions" aria-label="Kontrol presentasi">
        <button
          type="button"
          class="icon-button"
          data-action="map"
          title="Peta presentasi"
          aria-label="Peta presentasi"
        >
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3" y="3" width="6" height="6" rx="1.2" />
            <rect x="11" y="3" width="6" height="6" rx="1.2" />
            <rect x="3" y="11" width="6" height="6" rx="1.2" />
            <rect x="11" y="11" width="6" height="6" rx="1.2" />
          </svg>
        </button>

        <button
          type="button"
          class="icon-button"
          data-action="overview"
          title="Overview semua slide (Esc)"
          aria-label="Overview semua slide"
        >
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M10 3 3 6.5 10 10l7-3.5L10 3Z" stroke-linejoin="round" />
            <path d="m3 10 7 3.5L17 10" stroke-linejoin="round" />
            <path d="m3 13.5 7 3.5 7-3.5" stroke-linejoin="round" />
          </svg>
        </button>

        <button
          type="button"
          class="icon-button icon-button--theme"
          data-action="theme"
          title="Tema gelap (T)"
          aria-label="Aktifkan tema gelap"
          aria-pressed="false"
        >
          <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="10" cy="10" r="3.2" />
            <path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" stroke-linecap="round" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M15.6 12.1A6.2 6.2 0 0 1 7.9 4.4a6.7 6.7 0 1 0 7.7 7.7Z" stroke-linejoin="round" />
          </svg>
        </button>

        <button
          type="button"
          class="icon-button icon-button--text"
          data-action="help"
          title="Panduan navigasi (?)"
          aria-label="Panduan navigasi"
        >
          ?
        </button>
      </nav>
    </header>

    <div class="help-overlay" data-help-overlay hidden>
      <div
        class="help-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="help-title"
        tabindex="-1"
      >
        <div class="help-panel__header">
          <div>
            <p class="eyebrow">Panduan</p>
            <h2 id="help-title">Navigasi &amp; presenter</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            data-action="close-help"
            aria-label="Tutup panduan"
          >
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="m5 5 10 10M15 5 5 15" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="shortcut-grid" data-shortcut-grid></div>
        <p class="help-panel__note">
          Speaker notes terbuka di jendela terpisah. Izinkan pop-up bila browser
          meminta. Tekan <kbd>Esc</kbd> untuk menutup panduan ini.
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
